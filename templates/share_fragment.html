<form method="POST" action="/books/{{.Book.Slug}}/share" class="row g-2 mb-3 share-form">
<div class="col-md-3"><select name="permission" class="form-select"><option value="viewer">Read Only</option><option value="editor">Edit</option></select></div>
<div class="col-md-3"><select name="expiry" class="form-select"><option value="1h">1 jam</option><option value="6h">6 jam</option><option value="12h">12 jam</option><option value="24h" selected>24 jam</option><option value="3d">3 hari</option><option value="7d">7 hari</option><option value="30d">30 hari</option></select></div>
<div class="col-md-3"><button class="btn btn-primary">Buat Link</button></div>
</form>
<div id="shareResult"></div>
{{if .Links}}
<table id="linksTable" class="table table-sm"><thead><tr><th>Permission</th><th>Kedaluwarsa</th><th>Status</th><th></th></tr></thead><tbody>
{{range .Links}}<tr>
<td>{{.Permission}}</td>
<td>{{fmtTime .ExpiresAt}}</td>
<td>{{if .RevokedAt}}<span class="text-danger">Dicabut</span>{{else if .ExpiresAt.Before $.Now}}<span class="text-warning">Kedaluwarsa</span>{{else}}<span class="text-success">Aktif</span>{{end}}</td>
<td>{{if not .RevokedAt}}<button class="btn btn-sm btn-outline-danger revoke-link-btn" data-linkid="{{.ID}}">Cabut</button>{{end}}</td>
</tr>{{end}}
</tbody></table>
{{else}}<p class="text-muted">Belum ada link.</p>{{end}}
