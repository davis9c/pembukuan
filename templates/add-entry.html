<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entri Baru - {{.Book.Name}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-3">
        <a class="navbar-brand" href="/"><strong>Pembukuan</strong></a>
        <span class="navbar-text text-white small">{{.User.Username}} &middot; <a href="/logout" class="text-white text-decoration-none">Keluar</a></span>
    </nav>
    <div class="container mt-4" style="max-width: 560px;">
        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/">Dashboard</a></li><li class="breadcrumb-item"><a href="/books/{{.Book.ID}}">{{.Book.Name}}</a></li><li class="breadcrumb-item active">Entri Baru</li></ol></nav>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h5 class="mb-3">Entri Baru</h5>
                {{if .Error}}<div class="alert alert-danger py-2">{{.Error}}</div>{{end}}
                <form method="POST" action="/books/{{.Book.ID}}/entries" enctype="multipart/form-data">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="date_mode" class="form-label">Mode Tanggal</label>
                            <select id="date_mode" name="date_mode" class="form-select" onchange="toggleDate()">
                                <option value="auto">Otomatis (sekarang)</option>
                                <option value="manual">Manual</option>
                            </select>
                        </div>
                        <div class="col-md-6" id="date_manual_group" style="display:none">
                            <label for="date" class="form-label">Tanggal &amp; Jam</label>
                            <input type="datetime-local" id="date" name="date" class="form-control">
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="type" class="form-label">Tipe *</label>
                            <select id="type" name="type" class="form-select" required>
                                <option value="debit">Debit (Uang Masuk)</option>
                                <option value="credit">Kredit (Uang Keluar)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="amount" class="form-label">Jumlah (Rp) *</label>
                            <input type="number" id="amount" name="amount" class="form-control" required min="1" placeholder="100000">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Deskripsi</label>
                        <textarea id="description" name="description" class="form-control" rows="2" placeholder="Keterangan transaksi"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="files" class="form-label">Lampiran / Bukti <small class="text-muted">(max 5, gambar/PDF)</small></label>
                        <input type="file" id="files" name="files" class="form-control" multiple accept="image/*,application/pdf" capture="environment">
                        <div id="preview" class="d-flex gap-1 flex-wrap mt-2"></div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/books/{{.Book.ID}}" class="btn btn-secondary">Batal</a>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function toggleDate() {
            var mode = document.getElementById('date_mode').value;
            var grp = document.getElementById('date_manual_group');
            grp.style.display = mode === 'manual' ? 'block' : 'none';
            if (mode === 'auto') {
                document.getElementById('date').value = '';
            }
        }
    </script>
</body>
</html>
