<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark"><script>document.documentElement.setAttribute('data-bs-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script><title>Link Dibuat - Pembukuan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-primary"><div class="container-fluid"><a class="navbar-brand" href="/"><strong>Pembukuan</strong></a></div></nav>
<div class="container mt-4" style="max-width:600px;">
<h5>Link Berbagi Dibuat</h5>
<div class="alert alert-warning">Simpan link ini. Token tidak akan ditampilkan lagi.</div>
<div class="input-group mb-3"><input type="text" class="form-control" value="{{.Link}}" id="linkVal" readonly><button class="btn btn-outline-secondary" onclick="copyLink()">Salin</button></div>
<p class="small text-muted">Kedaluwarsa: {{fmtTime .ExpiresAt}}. Akses: {{.Permission}}.</p>
<a href="/books/{{.BookSlug}}/share" class="btn btn-secondary btn-sm">Kembali</a>
</div>
<script>
function copyLink() {
    var el = document.getElementById('linkVal');
    navigator.clipboard.writeText(el.value).then(function() {
        var btn = el.nextElementSibling;
        var old = btn.textContent;
        btn.textContent = 'Tersalin!';
        setTimeout(function(){ btn.textContent = old; }, 1500);
    });
}
</script>
</body></html>
