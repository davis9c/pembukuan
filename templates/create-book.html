<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>(function(){var s=localStorage.getItem('theme')||'auto';document.documentElement.setAttribute('data-bs-theme',s==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s);document.documentElement.setAttribute('data-theme-mode',s)})()</script>
    <title>Buku Baru - Pembukuan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{{template "_navbar.html" .}}
    <div class="container mt-4" style="max-width: 500px;">
        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/">Dashboard</a></li><li class="breadcrumb-item active">Buku Baru</li></ol></nav>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h5 class="mb-3">Buat Buku Baru</h5>
                {{if .Error}}<div class="alert alert-danger py-2">{{.Error}}</div>{{end}}
                <form method="POST" action="/books/new">
                    <div class="mb-3"><label for="name" class="form-label">Nama Buku *</label><input type="text" id="name" name="name" class="form-control" required autofocus placeholder="Contoh: Keuangan 2024"></div>
                    <div class="mb-3"><label for="description" class="form-label">Deskripsi</label><textarea id="description" name="description" class="form-control" rows="3" placeholder="Deskripsi singkat (opsional)"></textarea></div>
<div class="mb-3"><label for="opening_balance" class="form-label">Saldo Awal (Rp)</label><input type="number" id="opening_balance" name="opening_balance" class="form-control" value="0"></div>
                    <div class="d-flex justify-content-end gap-2"><a href="/" class="btn btn-secondary">Batal</a><button type="submit" class="btn btn-primary">Simpan</button></div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
