{{if .BookUsers}}
<table id="usersTable" class="table table-hover align-middle"><thead><tr><th>Username</th><th>Role</th><th></th></tr></thead><tbody>{{range .BookUsers}}<tr><td>{{.Username}}</td><td>{{if eq .Role "owner"}}<span class="badge text-bg-warning">Owner</span>{{else if eq .Role "editor"}}<span class="badge text-bg-primary">Editor</span>{{else}}<span class="badge text-bg-secondary">Viewer</span>{{end}}</td><td class="text-end"><button class="btn btn-outline-danger btn-sm remove-user-btn" data-userid="{{.UserID}}">Hapus</button></td></tr>{{end}}</tbody></table>
{{else}}<div class="text-center text-muted py-4">Belum ada user ditambahkan.</div>{{end}}
