services:
  app:
    build: .
    ports:
      - "${PORT:-8084}:${PORT:-8084}"
    volumes:
      - data:/data
    env_file:
      - .env
    environment:
      - DB_PATH=/data/pembukuan.db
      - UPLOADS_DIR=/data/uploads
      - BASE_URL=${BASE_URL:-http://localhost:8084}
    restart: unless-stopped

volumes:
  data: